name: Build and publish to R2

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated packages; blank retries unpublished vendor versions'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '*/**'
      - 'ci/**'
      - 'tests/**'
      - 'build.sh'
      - 'aur-watch.sh'
      - 'nvchecker.toml'
      - 'nvchecker-old.json'
      - 'update-policy.json'
      - '.github/workflows/*.yml'
  push:
    branches:
      - main
    paths:
      # A reviewed recipe change can be a hook, install script, patch, wrapper,
      # desktop file, or nested source file -- not just PKGBUILD.
      - '*/**'
      - 'ci/**'
      - 'tests/**'
      - 'build.sh'
      - 'aur-watch.sh'
      - 'nvchecker.toml'
      - 'nvchecker-old.json'
      - 'update-policy.json'
      - '.github/workflows/*.yml'

# Pull requests receive only build/test access. Publishing is additionally gated
# by event type in the publish job; only the final state job can write main.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('build-candidate-{0}', github.ref_name) || 'build-and-publish' }}
  queue: max
  # GitHub forbids queue:max together with a true cancel-in-progress value.
  # Retaining each check is preferable to weakening the serialized main queue.
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base
    outputs:
      snapshot_sha: ${{ steps.selection.outputs.snapshot_sha }}
      has_builds: ${{ steps.selection.outputs.has_builds }}
      matrix: ${{ steps.selection.outputs.matrix }}

    steps:
      - name: Install selection tools
        run: pacman -Syu --noconfirm --needed git python

      # Main publications resolve the newest branch head only after this workflow
      # owns the serialized publisher. PR and explicitly dispatched autobump
      # checks use their exact candidate commit and can never publish below.
      - name: Check out the immutable source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark the checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select independent package builds
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCE_PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/selection"
          snapshot_sha=$(git rev-parse HEAD)
          EVENT_NAME="$EVENT_NAME" \
          BASE_SHA="$BASE_SHA" \
          CURRENT_SHA="$snapshot_sha" \
          FORCE_PACKAGES="$FORCE_PACKAGES" \
            ./ci/prepare.sh "$output_dir"

          printf 'snapshot_sha=%s\n' "$snapshot_sha" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$(tr -d '\n' < "$output_dir/matrix.json")" \
            >> "$GITHUB_OUTPUT"
          if [ -s "$output_dir/packages.txt" ]; then
            echo 'has_builds=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Selected package builds'
              sed 's/^/- /' "$output_dir/packages.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_builds=false' >> "$GITHUB_OUTPUT"
            echo 'No package build is required.' >> "$GITHUB_STEP_SUMMARY"
          fi

  policy:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:base

    steps:
      - name: Install the Bash parser and test tools
        run: pacman -Syu --noconfirm --needed git python shfmt

      - name: Check out the same source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.snapshot_sha }}
          persist-credentials: false

      - name: Validate every update contract and comparator test
        run: |
          python3 ci/recipe-ir.py validate
          python3 -m unittest discover -s tests -v
          bash -n build.sh aur-watch.sh ci/*.sh

  prepare-policy:
    needs: select
    if: needs.select.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel

    steps:
      - name: Install metadata preparation tools
        run: pacman -Syu --noconfirm --needed git

      - name: Check out the same source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.snapshot_sha }}
          persist-credentials: false

      - name: Derive this package's artifact policy as an unprivileged user
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          useradd -m policyuser
          install -d -o policyuser -g policyuser -m0755 /policy
          policy_dir="/policy/policy-$PACKAGE"
          install -d -o policyuser -g policyuser -m0755 "$policy_dir"
          chown -R policyuser:policyuser "$GITHUB_WORKSPACE/$PACKAGE"
          runuser -u policyuser -- env HOME=/home/policyuser \
            ./ci/prepare-package.sh "$PACKAGE" "$policy_dir"
          chown -R root:root /policy
          chmod -R a-w /policy

      - name: Upload policy independently from every build job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: policy-${{ matrix.package }}
          path: /policy
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [select, policy, prepare-policy]
    if: >-
      ${{ always() && needs.select.outputs.has_builds == 'true' &&
          needs.policy.result == 'success' &&
          (needs.prepare-policy.result == 'success' ||
           needs.prepare-policy.result == 'failure') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            git gnupg openssh python sudo

      - name: Check out the same source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.snapshot_sha }}
          persist-credentials: false

      - name: Mark the checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download the independently prepared artifact policy
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: policy-${{ matrix.package }}
          path: /policy

      - name: Build this package as an unprivileged user
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          useradd -m builduser
          echo 'builduser ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builduser
          install -d -o builduser -g builduser -m0755 /artifacts
          install -o builduser -g builduser -m0644 \
            /policy/packages.txt /home/builduser/packages.txt
          install -o builduser -g builduser -m0644 \
            /policy/expected-packages.tsv \
            /home/builduser/expected-packages.tsv
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          runuser -u builduser -- env HOME=/home/builduser \
            ./ci/build-packages.sh /home/builduser/packages.txt \
              /home/builduser/expected-packages.tsv /artifacts

      - name: Assemble the successful matrix artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          artifact_dir="$RUNNER_TEMP/built/built-$PACKAGE/packages"
          install -d -m0755 "$artifact_dir"
          find /artifacts -mindepth 1 -maxdepth 1 -type f \
            -exec install -m0644 -t "$artifact_dir" -- {} +

      - name: Upload this successful package build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: built-${{ matrix.package }}
          path: ${{ runner.temp }}/built
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [select, policy, prepare-policy, build]
    if: >-
      ${{ always() && github.event_name != 'pull_request' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
          needs.select.outputs.has_builds == 'true' &&
          needs.policy.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Install publishing tools
        run: pacman -Syu --noconfirm --needed git gnupg rclone

      - name: Check out the built source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.snapshot_sha }}
          persist-credentials: false

      - name: Download every successful matrix artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: built-*
          path: ${{ runner.temp }}/downloads
          # v5+ flattens a pattern that happens to match only one artifact.
          # Every upload therefore carries its own unique top-level directory.
          merge-multiple: true

      - name: Download policies from the separate metadata jobs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: policy-*
          path: ${{ runner.temp }}/policies
          merge-multiple: true

      - name: Validate and combine successes before exposing secrets
        run: |
          ./ci/collect-built-packages.sh \
            "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/policies" /packages \
            "$RUNNER_TEMP/expected-packages.tsv" \
            "$RUNNER_TEMP/published-versions.tsv"

      - name: Sign and publish successful packages to R2
        env:
          GNUPGHOME: /publisher-gnupg
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGN_KEY: ${{ secrets.GPG_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: archlinux
          REPO_NAME: nekolsd
        run: |
          ./ci/publish.sh /packages \
            "$RUNNER_TEMP/expected-packages.tsv" /repo

      - name: Upload the exact successful-publication state
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: published-state
          path: ${{ runner.temp }}/published-versions.tsv
          if-no-files-found: error
          retention-days: 1

  record:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the latest main without executing package content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download the successful-publication state
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: published-state
          path: ${{ runner.temp }}/published-state

      - name: Advance only versions that reached R2
        run: |
          python3 ci/advance-published.py nvchecker-old.json \
            "$RUNNER_TEMP/published-state/published-versions.tsv"
          if git diff --quiet -- nvchecker-old.json; then
            echo 'Publication state was already current.'
            exit 0
          fi
          if [ "$(git diff --name-only --)" != nvchecker-old.json ]; then
            echo 'Refusing to commit an unexpected path.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add nvchecker-old.json
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit \
            -m 'CI: advance successful publication state [skip ci]'
          git push origin HEAD:main
