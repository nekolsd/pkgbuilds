name: Build and publish to R2

on:
  schedule:
    # 18:00 UTC, once a day
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Optional space-separated package names to rebuild'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      # A reviewed recipe change can be a hook, install script, patch, wrapper,
      # desktop file, or even a nested source file -- not just PKGBUILD.
      - '*/**'
      - '!.github/**'
      - '.github/workflows/build.yml'

# Jobs inherit read-only repository access. Only `commit` receives write access,
# and that job never executes a PKGBUILD or package artifact.
permissions:
  contents: read

concurrency:
  # One publisher at a time, so two runs never rewrite the R2 database together.
  group: build-and-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      has_builds: ${{ steps.selection.outputs.has_builds }}
      has_recipe_changes: ${{ steps.selection.outputs.has_recipe_changes }}

    steps:
      - name: Install preparation tools
        run: |
          pacman -Syu --noconfirm --needed \
            git nvchecker pacman-contrib python

      - name: Check out without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark the checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select packages and prepare vendor recipes
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_PACKAGES: ${{ inputs.packages }}
        run: |
          output_dir="$RUNNER_TEMP/prepared"
          ./ci/prepare.sh "$output_dir"

          if [ -s "$output_dir/packages.txt" ]; then
            echo 'has_builds=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_builds=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -s "$output_dir/recipe.patch" ]; then
            echo 'has_recipe_changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_recipe_changes=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prepared metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prepared-changes
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            git gnupg openssh python sudo

      - name: Check out without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mark the checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download prepared metadata
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: prepared-changes
          path: ${{ runner.temp }}/prepared

      - name: Apply prepared recipe changes
        run: ./ci/apply-prepared-changes.sh "$RUNNER_TEMP/prepared/recipe.patch"

      - name: Create the unprivileged build user
        run: |
          useradd -m builduser
          echo 'builduser ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builduser
          install -d -o builduser -g builduser -m0755 /artifacts
          install -o builduser -g builduser -m0644 \
            "$RUNNER_TEMP/prepared/packages.txt" /home/builduser/packages.txt
          install -o builduser -g builduser -m0644 \
            "$RUNNER_TEMP/prepared/expected-packages.tsv" /home/builduser/expected-packages.tsv
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: Build unsigned packages without publishing credentials
        run: |
          runuser -u builduser -- env HOME=/home/builduser \
            ./ci/build-packages.sh /home/builduser/packages.txt \
              /home/builduser/expected-packages.tsv /artifacts

      - name: Upload unsigned packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-packages
          path: /artifacts
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_builds == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install publishing tools
        run: |
          pacman -Syu --noconfirm --needed \
            git gnupg rclone

      - name: Check out without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download unsigned packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: unsigned-packages
          path: /packages

      - name: Download prepared artifact policy
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: prepared-changes
          path: ${{ runner.temp }}/prepared

      - name: Verify package artifact before exposing secrets
        run: |
          ./ci/publish.sh --verify-only /packages \
            "$RUNNER_TEMP/prepared/expected-packages.tsv"

      - name: Sign and publish to R2
        env:
          GNUPGHOME: /publisher-gnupg
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGN_KEY: ${{ secrets.GPG_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: archlinux
          REPO_NAME: nekolsd
        run: |
          ./ci/publish.sh /packages \
            "$RUNNER_TEMP/prepared/expected-packages.tsv" /repo

  commit:
    needs: [prepare, publish]
    if: needs.prepare.outputs.has_recipe_changes == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the latest branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download prepared metadata
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: prepared-changes
          path: ${{ runner.temp }}/prepared

      - name: Validate and apply the prepared recipe patch
        run: ./ci/apply-prepared-changes.sh "$RUNNER_TEMP/prepared/recipe.patch"

      - name: Commit the published vendor versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'CI: advance published vendor versions [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
