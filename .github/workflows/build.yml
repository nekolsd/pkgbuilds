name: Build and publish to R2

on:
  schedule:
    # 18:00 UTC, once a day
    - cron: '0 18 * * *'
  workflow_dispatch:          # manual trigger
  push:
    branches:
      - main
    paths:
      # A reviewed recipe change can be a hook, install script, patch, wrapper,
      # desktop file, or even a nested source file -- not just PKGBUILD.
      - '*/**'
      - '!.github/**'
      - '.github/workflows/build.yml'

# Version bumps get committed back to this repository.
permissions:
  contents: write

concurrency:
  # One build at a time, so two jobs never rewrite the database on R2 at once.
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git nvchecker rclone pacman-contrib openssh python

      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the build user
        # makepkg refuses to run as root, and this keeps privileges minimal anyway.
        run: |
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builduser
          chown -R builduser:builduser "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # build.sh commits after a version bump, so builduser needs an identity —
          # without one the commit fails (the build carries on, but the version
          # change is lost).
          runuser -u builduser -- git config --global user.name  'github-actions[bot]'
          runuser -u builduser -- git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          runuser -u builduser -- git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import the GPG signing subkey
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          install -d -o builduser -g builduser -m 700 /home/builduser/.gnupg
          printf '%s' "$GPG_SIGNING_KEY" | runuser -u builduser -- gpg --batch --import
          # Let gpg-agent take the passphrase from secrets with no tty available.
          {
            echo "allow-loopback-pinentry"
            echo "default-cache-ttl 7200"
          } > /home/builduser/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > /home/builduser/.gnupg/gpg.conf
          [ -n "$GPG_PASSPHRASE" ] && \
            echo "passphrase $GPG_PASSPHRASE" >> /home/builduser/.gnupg/gpg.conf || true
          chown -R builduser:builduser /home/builduser/.gnupg

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          install -d -o builduser -g builduser -m 700 /home/builduser/.config/rclone
          cat > /home/builduser/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF
          chown -R builduser:builduser /home/builduser/.config

      - name: Pull the existing repository from R2
        # Essential: the container is new every run, and without syncing down first
        # repo-add rebuilds the index from an empty directory, dropping every package
        # that was not built this time.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: archlinux
        run: |
          install -d -o builduser -g builduser /repo
          runuser -u builduser -- rclone sync "r2:${R2_BUCKET}/${R2_PREFIX}/x86_64" /repo \
            --transfers 8 --checkers 16 --fast-list
          echo "pulled $(ls /repo/*.pkg.tar.zst 2>/dev/null | wc -l) existing packages"

      - name: Build vendor updates or reviewed local changes
        env:
          BUILD_BACKEND: makepkg
          REPO_DIR: /repo
          # The repo name is not a secret; keeping it here makes it easy to change.
          REPO_NAME: nekolsd
          SIGN_KEY: ${{ secrets.GPG_KEY_ID }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          build_as_user() {
            runuser -u builduser -- env \
              BUILD_BACKEND="$BUILD_BACKEND" REPO_DIR="$REPO_DIR" \
              REPO_NAME="$REPO_NAME" SIGN_KEY="$SIGN_KEY" \
              ./build.sh "$@"
          }

          if [ "$EVENT_NAME" = push ]; then
            mapfile -d '' -t changed_packages < <(
              declare -A emitted=()
              while IFS= read -r -d '' path; do
                [[ $path == */* ]] || continue
                package=${path%%/*}
                [ -f "$package/PKGBUILD" ] || continue
                [ -z "${emitted[$package]+present}" ] || continue
                emitted["$package"]=1
                printf '%s\0' "$package"
              done < <(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" --)
            )

            if [ ${#changed_packages[@]} -gt 0 ]; then
              printf 'reviewed package changes: %s\n' "${changed_packages[*]}"
              for package in "${changed_packages[@]}"; do
                build_as_user "$package"
              done
              exit 0
            fi
          fi

          # Schedules, manual runs, and build-workflow-only changes use the
          # vendor endpoints. AUR is never consulted by this path.
          build_as_user --outdated

      - name: Sync back to R2
        # --copy-links is not optional: repo-add makes nekolsd.db a symlink to
        # nekolsd.db.tar.zst, object storage has no notion of symlinks, and rclone
        # skips them by default — while nekolsd.db is exactly what pacman asks for.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: archlinux
        run: |
          # Packages first, database last: if this fails halfway the database still
          # points at the previous versions (which are all still there), rather than
          # leaving a window where the index promises a file that is not uploaded yet.
          runuser -u builduser -- rclone copy --copy-links /repo "r2:${R2_BUCKET}/${R2_PREFIX}/x86_64" \
            --exclude '*.db*' --exclude '*.files*' --transfers 8 --fast-list
          runuser -u builduser -- rclone copy --copy-links /repo "r2:${R2_BUCKET}/${R2_PREFIX}/x86_64" \
            --include '*.db*' --include '*.files*'
          # Finally drop superseded packages from the remote.
          runuser -u builduser -- rclone sync --copy-links /repo "r2:${R2_BUCKET}/${R2_PREFIX}/x86_64" \
            --transfers 8 --fast-list

      - name: Push version changes
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # build.sh already commits after a version bump, so the working tree is
          # usually clean here. The condition has to be "are there unpushed commits",
          # not "are there uncommitted changes" — the latter is never true, which
          # meant successful builds never pushed their version changes.
          git add -A
          git diff --cached --quiet || git commit -m "CI: build artifacts changed [skip ci]"

          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "nothing to push"
          else
            git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
