name: Review every AUR source change

# Vendor endpoints and nvchecker remain the only automatic version path. This
# workflow is an optional, read-only watch on AUR: an outage here cannot stop a
# build, and no AUR object is ever checked out or executed.
on:
  schedule:
    # 10:00 UTC = 18:00 Asia/Singapore, eight hours before the vendor build.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aur-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base

    steps:
      - name: Install the read-only tooling
        run: pacman -Syu --noconfirm --needed git github-cli python shfmt

      - name: Check out the local recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # AUR objects are parsed later in this job. Do not leave a repository
          # write credential available while the untrusted objects are inspected.
          persist-credentials: false

      # Container jobs can see the bind-mounted checkout under a different UID.
      # Git otherwise rejects the repository when gh configures its credential
      # helper in the write-enabled step below.
      - name: Mark the checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Find changed AUR commits
        id: scan
        shell: bash
        run: |
          if ! ./aur-watch.sh check \
              > /tmp/aur-changes.tsv \
              2> /tmp/aur-errors.log; then
            cat /tmp/aur-errors.log >&2
            exit 1
          fi
          [ ! -s /tmp/aur-errors.log ] || cat /tmp/aur-errors.log >&2

          if [ -s /tmp/aur-changes.tsv ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### AUR changes detected for parsed classification'
              cut -f1 /tmp/aur-changes.tsv | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No AUR commits changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/aur-errors.log ]; then
            {
              echo
              echo '### AUR checks that were unavailable'
              echo 'These warnings do not affect vendor-driven builds.'
              sed 's/^/- /' /tmp/aur-errors.log
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Classify parsed changes and render exceptional reports
        if: steps.scan.outputs.changed == 'true'
        id: reports
        shell: bash
        run: |
          : > /tmp/aur-safe.tsv
          : > /tmp/aur-reviewable.tsv
          while IFS=$'\t' read -r pkg old_commit new_commit; do
            if ! result=$(./aur-watch.sh classify \
                "$pkg" "$old_commit" "$new_commit"); then
              result=$'unknown\tfalse\tclassification command failed'
            fi
            IFS=$'\t' read -r classification safe reason <<< "$result"

            if [ "$safe" = true ]; then
              printf '%s\t%s\t%s\t%s\n' \
                "$pkg" "$old_commit" "$new_commit" "$classification" \
                >> /tmp/aur-safe.tsv
              printf -- '- `%s`: %s (%s)\n' "$pkg" "$classification" "$reason" \
                >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            body="/tmp/aur-$pkg.md"
            if ./aur-watch.sh report \
                "$pkg" "$old_commit" "$new_commit" > "$body"; then
              {
                printf '> Parsed classification: **%s** — %s\n\n' \
                  "$classification" "$reason"
                cat "$body"
              } > "$body.with-classification"
              mv "$body.with-classification" "$body"
              printf '%s\t%s\t%s\t%s\n' \
                "$pkg" "$old_commit" "$new_commit" "$classification" \
                >> /tmp/aur-reviewable.tsv
            else
              rm -f "$body"
              echo "::warning title=AUR changed during review::$pkg will be retried next run"
            fi
          done < /tmp/aur-changes.tsv

          if [ -s /tmp/aur-reviewable.tsv ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -s /tmp/aur-safe.tsv ]; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Record release-only AUR positions without review PRs
        if: steps.reports.outputs.safe == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com --force
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          git checkout -B aur-watch-safe-baselines origin/main
          while IFS=$'\t' read -r pkg old_commit new_commit classification; do
            ./aur-watch.sh set-seen "$pkg" "$new_commit"
          done < /tmp/aur-safe.tsv

          if ! git diff --quiet -- aur-seen.lock; then
            git add aur-seen.lock
            git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit \
              -m 'AUR: record release-only source updates [skip ci]'
            git push origin HEAD:main
          fi

          # Retire lock-only PRs created by the previous all-changes workflow.
          # A PR containing any hand-ported recipe work is deliberately preserved.
          while IFS=$'\t' read -r pkg old_commit new_commit classification; do
            branch="aur-watch/$pkg"
            pr_number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
              --json number --jq '.[0].number // empty')
            [ -n "$pr_number" ] || continue
            if ! changed_paths=$(gh pr diff "$pr_number" \
                --repo "$GITHUB_REPOSITORY" --name-only); then
              echo "::warning title=Could not inspect old AUR PR::$pkg PR #$pr_number was preserved"
              continue
            fi
            if [ -z "$changed_paths" ] || [ "$changed_paths" = aur-seen.lock ]; then
              gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --comment "The parsed AUR change is ${classification}; its baseline was recorded automatically without adopting AUR package content."
            fi
          done < /tmp/aur-safe.tsv

      - name: Open or update one review PR per package
        if: steps.reports.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checkout deliberately did not persist credentials. Enable Git's gh
          # credential helper only now, after all AUR parsing has finished.
          gh auth setup-git --hostname github.com --force
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          while IFS=$'\t' read -r pkg old_commit new_commit classification; do
            branch="aur-watch/$pkg"
            body="/tmp/aur-$pkg.md"
            branch_advanced=false
            candidate_changed=false

            pr_number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch" --state open \
              --json number --jq '.[0].number // empty')

            if [ -n "$pr_number" ]; then
              git fetch origin \
                "refs/heads/$branch:refs/remotes/origin/$branch"
              git checkout -B "$branch" "origin/$branch"
              if ! git merge-base --is-ancestor origin/main HEAD; then
                if git -c commit.gpgsign=false merge --no-edit origin/main; then
                  branch_advanced=true
                else
                  git merge --abort || true
                  echo "::warning title=AUR review branch conflict::$pkg was preserved for manual reconciliation"
                  continue
                fi
              fi
              new_pr=false
            else
              # Fetch a stale closed-PR branch, if one exists, only to establish a
              # force-with-lease value. The new review always starts from main.
              git fetch origin \
                "refs/heads/$branch:refs/remotes/origin/$branch" \
                2>/dev/null || true
              git checkout -B "$branch" origin/main
              new_pr=true
            fi

            ./aur-watch.sh set-seen "$pkg" "$new_commit"
            if git diff --quiet -- aur-seen.lock; then
              # main still has the old baseline until this PR is merged, so the
              # scanner will rediscover it every day. Preserve the reviewer's PR
              # body and ready/draft choice when the candidate itself is unchanged.
              if [ "$branch_advanced" = false ]; then
                echo "::notice::$pkg review PR already tracks ${new_commit:0:12}"
                continue
              fi
            else
              git add aur-seen.lock
              git -c commit.gpgsign=false commit \
                -m "$pkg: review AUR commit ${new_commit:0:12}"
              candidate_changed=true
            fi

            if [ "$new_pr" = true ]; then
              git push --force-with-lease origin "HEAD:refs/heads/$branch"
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main --head "$branch" --draft \
                --title "$pkg: review AUR commit ${new_commit:0:12}" \
                --body-file "$body"
            else
              git push origin "HEAD:refs/heads/$branch"
              if [ "$candidate_changed" = true ]; then
                gh pr edit "$pr_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$pkg: review AUR commit ${new_commit:0:12}" \
                  --body-file "$body"
                # A newer AUR commit invalidates any earlier readiness decision.
                gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" --undo || true
              else
                echo "::notice::$pkg review branch was synchronized with main"
              fi
            fi
          done < /tmp/aur-reviewable.tsv
